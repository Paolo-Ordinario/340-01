<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saved Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'DM Sans', sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f4f4; 
        }
        .page-container { 
            max-width: 1200px; 
            margin: 0 auto 40px auto; 
        }
        .product-section { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 0px 10px rgba(0,0,0,0.1); 
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .product-section h5 { 
            font-size: 18px; 
            font-weight: bold; 
            margin: 0;
        }
        .product-grid { 
            display: grid; 
            gap: 20px; 
            grid-template-columns: repeat(2, 1fr); 
        }
        .product-card { 
            border: 1px solid #eee; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 0px 5px rgba(0,0,0,0.1); 
            transition: transform 0.2s ease; 
            background: white; 
            position: relative;
        }
        .product-card:hover { 
            transform: translateY(-3px); 
        }
        .product-card img { 
            width: 100%; 
            height: 150px; 
            object-fit: cover; 
            display: block; 
        }
        .card-info { 
            padding: 10px; 
        }
        .product-name { 
            font-size: 14px; 
            font-weight: 500; 
            margin: 0 0 4px 0; 
        }
        .product-seller { 
            font-size: 12px; 
            color: #888; 
            margin: 0 0 4px 0; 
        }
        .product-price { 
            font-size: 16px; 
            font-weight: bold; 
            color: #1c1c1e; 
            margin: 0; 
        }
        .unsave-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            transition: transform 0.2s ease;
            z-index: 2;
        }
        .unsave-btn:hover { 
            transform: scale(1.2); 
            background: white;
        }
        .view-btn {
            display: block;
            margin: 10px 10px 10px 10px;
            padding: 6px;
            background: #22c277;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s ease;
            width: calc(100% - 20px);
        }
        .view-btn:hover { 
            background: rgb(48, 186, 89); 
            color: white;
        }
        .no-results { 
            grid-column: 1/-1; 
            text-align: center; 
            padding: 3rem; 
            color: #888; 
        }
        .loading { 
            grid-column: 1/-1; 
            text-align: center; 
            padding: 3rem; 
            color: #aaa; 
            font-style: italic; 
        }
        .signout-btn { 
            background: transparent; 
            border: 1px solid #aaa; 
            color: #ccc; 
            padding: 5px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            cursor: pointer; 
            transition: all 0.2s; 
            width: auto;
            margin: 0;
        }
        .signout-btn:hover { 
            background: #dc3545; 
            border-color: #dc3545; 
            color: white; 
        }
        .back-link { 
            display: inline-block; 
            margin-bottom: 16px; 
            font-size: 14px; 
            color: #22c277; 
            text-decoration: none; 
            font-weight: 600; 
        }
        .back-link:hover { 
            text-decoration: underline; 
        }
        @media (max-width: 576px) { 
            .product-grid { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="Saved.html">Saved</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="prototype.html">Market</a>
                <a class="nav-link" href="ProfilePrototpye.html">Profile</a>
                <a class="nav-link" href="Saved.html">Saved</a>
                <a class="nav-link" href="Inbox.html">Inbox</a>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary" id="navUsername" style="font-size:13px;"></span>
                <button class="signout-btn" onclick="signOut()">Sign Out</button>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <a class="back-link" href="prototype.html">&larr; Back to Market</a>
        <div class="product-section">
            <div class="section-header">
                <h5>Saved Listings</h5>
                <span id="savedCount" style="font-size:13px;color:#888;"></span>
            </div>
            <div class="product-grid" id="productGrid">
                <div class="loading">Loading saved listings...</div>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080';
        const PLACEHOLDER = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80';
        const loggedInUser = JSON.parse(localStorage.getItem('user'));

        if (!loggedInUser) { window.location.href = 'login.html'; }
        else { document.getElementById('navUsername').textContent = '@' + loggedInUser.username; }

        function signOut() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        let usersMap = {};

        async function loadUsers() {
            try {
                const res = await fetch(`${API}/users`);
                const users = await res.json();
                users.forEach(u => usersMap[u.id] = u);
            } catch (e) {}
        }

        async function unsave(listingId) {
            if (!confirm('Remove from saved?')) return;
            try {
                await fetch(`${API}/saved/${loggedInUser.id}/${listingId}`, { method: 'DELETE' });
                loadSaved();
            } catch (e) { alert('Could not remove listing.'); }
        }

        async function loadSaved() {
            const grid = document.getElementById('productGrid');
            try {
                await loadUsers();
                const res = await fetch(`${API}/saved/${loggedInUser.id}`);
                const saved = await res.json();

                if (!saved.length) {
                    grid.innerHTML = '<div class="no-results">No saved listings yet. Browse the market and star items to save them!</div>';
                    document.getElementById('savedCount').textContent = '';
                    return;
                }

                const listingPromises = saved.map(s => 
                    fetch(`${API}/listings/${s.listingId}`).then(r => r.json())
                );
                const listings = await Promise.all(listingPromises);
                const active = listings.filter(l => l && !l.isSold);

                document.getElementById('savedCount').textContent = `${active.length} item${active.length !== 1 ? 's' : ''}`;

                if (!active.length) {
                    grid.innerHTML = '<div class="no-results">All your saved listings have been sold.</div>';
                    return;
                }

                grid.innerHTML = active.map(listing => {
                    const seller = usersMap[listing.userId];
                    const sellerDisplay = seller ? `@${seller.username}` : `User #${listing.userId}`;
                    const href = `ProfilePrototype2.html?userId=${listing.userId}`;

                    return `
                        <div class="product-card">
                            <img src="${API}/listings/${listing.id}/image" alt="${listing.title}" onerror="this.src='${PLACEHOLDER}'">
                            <button class="unsave-btn" onclick="unsave(${listing.id})" title="Remove from saved">★</button>
                            <div class="card-info">
                                <p class="product-name">${listing.title}</p>
                                <p class="product-seller">${sellerDisplay}</p>
                                <p class="product-price">$${parseFloat(listing.price).toFixed(2)}</p>
                            </div>
                            <a class="view-btn" href="${href}">View Seller</a>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                grid.innerHTML = '<div class="no-results" style="color:#dc3545;">Could not load saved listings.</div>';
            }
        }

        loadSaved();
    </script>
</body>
</html>
